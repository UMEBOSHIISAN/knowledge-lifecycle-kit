name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - name: Test knowledge lifecycle gate
        working-directory: knowledge-lifecycle-gate
        run: python -m pytest -q tests
      - name: Test routing and public contracts
        run: python -m unittest -v tests/test_routing.py tests/test_public_layout.py tests/test_verify_test_wheelhouse.py tests/test_public_boundary.py tests/test_ci_workflow.py
      - name: Scan public boundary
        run: python tools/check_public_boundary.py .
