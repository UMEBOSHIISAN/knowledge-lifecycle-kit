name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - name: Test knowledge lifecycle gate
        working-directory: knowledge-lifecycle-gate
        run: python -m pytest -q tests
      - name: Test public contracts and build artifacts
        run: python -m unittest discover -s tests -v
      - name: Scan public boundary
        run: python tools/check_public_boundary.py .
